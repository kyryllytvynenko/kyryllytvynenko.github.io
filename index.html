<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kyryl Lytvynenko · Apps</title>
    <meta name="description" content="Apps and games by Kyryl Lytvynenko." />
    <meta name="theme-color" content="#F7F5F2" />
    <link rel="icon" href="truth-or-dare/icon-192.png" />
    <style>
      :root {
        --ink: #1b1917;
        --page: #f7f5f2;
        --surface: #ffffff;
        --muted: #7a736c;
        --hairline: #ede8e2;
        --truth: #2e6b72;
        --dare: #d65a4e;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--page);
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 56px 16px calc(48px + env(safe-area-inset-bottom));
      }

      h1 {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0 0 6px;
      }

      .lede {
        color: var(--muted);
        margin: 0 0 32px;
      }

      .app {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        background: var(--surface);
        border: 1.5px solid var(--hairline);
        border-radius: 20px;
        padding: 18px;
      }

      .app img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        flex: none;
      }

      .app h2 {
        font-size: 18px;
        font-weight: 800;
        margin: 2px 0 4px;
      }

      .app p {
        color: var(--muted);
        margin: 0 0 12px;
        line-height: 1.5;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      a {
        color: var(--truth);
        font-weight: 600;
        text-underline-offset: 2px;
      }

      footer {
        margin-top: 40px;
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kyryl Lytvynenko</h1>
      <p class="lede">Small apps and games.</p>

      <section class="app">
        <img src="truth-or-dare/icon-192.png" alt="" />
        <div>
          <h2>Truth or Dare</h2>
          <p>A pass-the-phone party game for friends. Add names, pass the phone, pick truth or dare.</p>
          <div class="links">
            <a href="truth-or-dare/">Play in your browser</a>
            <a href="truth-or-dare/privacy/">Privacy policy</a>
          </div>
        </div>
      </section>

      <footer>Contact: <a href="mailto:stitcheree.dev@gmail.com">stitcheree.dev@gmail.com</a></footer>
    </main>
  </body>
</html>
